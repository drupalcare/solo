# Drupal.org GitLab CI for the Solo theme.
#
# For details on customizing this file see:
# https://www.drupal.org/docs/develop/git/using-gitlab-to-contribute-to-drupal/gitlab-ci
# https://project.pages.drupalcode.org/gitlab_templates/
include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

variables:
  # Solo declares ^11.3 || ^12 (solo.info.yml), so every major it claims gets a
  # job: current (11) and next (12). Run the jobs against the next major in
  # addition to the current core version so its readiness is verified on every
  # pipeline.
  OPT_IN_TEST_NEXT_MAJOR: '1'
  # THE LINE THAT WAS MISSING, and its absence is why that job had never run.
  # `OPT_IN_TEST_*` creates the job; `_AUTORUN_*` (default 'none') decides
  # whether it runs or sits behind a manual prerequisite. With only the opt-in
  # set, this project's D12 jobs showed as `manual`/`skipped` on every pipeline
  # while the pipeline itself reported success — measured 2026-09-06 on
  # pipeline 878576. A green pipeline with no coverage is worse than a missing
  # job, because it looks fine.
  _AUTORUN_NEXT_MAJOR: 'all'
  # Current core has moved past the 11.x floor, so the previous minor gets a
  # job too.
  OPT_IN_TEST_PREVIOUS_MINOR: '1'
  _AUTORUN_PREVIOUS_MINOR: 'all'
  # No previous-major job: 2.0.x requires ^11.3 || ^12, so Drupal 10 is not
  # claimed (it stays on 1.0.x).
  # Stylelint: the template runs `stylelint ... ./**/*.css`, which in its shell
  # (no globstar) reaches only fonts/*.css, the vendored Font Awesome that
  # .stylelintignore excludes, so the job saw ZERO files. `_STYLELINT_EXTRA` is
  # appended to the call (include.drupalci.variables.yml, `_STYLELINT_EXTRA`;
  # include.drupalci.main.yml, stylelint job). A bare directory name is expanded
  # by Stylelint itself, recursively. Measured on a replica: 148 files checked.
  _STYLELINT_EXTRA: 'css'
  # Spelling: skip vendored or third-party text that is not ours to correct:
  # fonts/ (Font Awesome and Google font CSS), css/w3-css/ (vendored W3.CSS)
  # and translations/ (Vietnamese .po, which en-US cannot check).
  _CSPELL_IGNORE_PATHS: 'fonts/**, css/w3-css/**, translations/**'

################
# Static CSS checks (no site, no browser).
#
# The drupal.org template image is PHP; whether it carries python3 is not
# established (needs checking), so this job does not rely on it. It runs in the
# official python:3.12-bookworm image (the full Debian-based tag, which carries
# python3 and git; needs checking on the first pipeline) and takes the project
# plus Composer's vendor tree from the `composer` job's artifact.
#
# What runs, and why each one can go red:
#   solo_libraries              the generated library data (fonts, schemes, breakpoints, libraries/) reads
#                               without a problem; check-schemes and check-cascade read the same set
#   build-breakpoints --check   the 15 generated breakpoint files match their sources
#   contrast-scan --strict      every predefined scheme keeps its text/border contrast
#   check-scheme-contrast       key pairs (site name, headings, links, menu, text) of all 50 schemes vs their region
#                               background: 4.5:1 (3:1 large); fails on a NEW failure; known ones sit in
#                               scripts/scheme-contrast-baseline.txt (palettes are the owner's design)
#   check-css-budget            declarations above 0,2,0, with an id, with !important:
#                               per folder, counts may fall and never rise
#   check-schemes               scheme records vs libraries, options, thumbnails, CSS
#   check-cascade               who wins between Solo, schemes and the generated region colors
# check-schemes and check-cascade read solo_utilities, which solo's composer.json
# requires (`drupal/solo_utilities: ^2.0`), so Composer is expected to have put it
# under web/modules. If it is not there the job prints SKIPPED with the reason and
# those two checks do not run; the log never shows a pass for a check that did not run.
# check-winners.py is NOT run here: it needs a Drupal docroot of contrib modules.
# Run it locally (see AGENTS.md).
# Each script prints how many files or declarations it read; read that line.
################
css-checks:
  stage: validate
  image: python:3.12-bookworm
  needs: [composer]
  script:
    - python3 -I scripts/solo_libraries.py
    - python3 -I scripts/build-breakpoints.py --check
    - python3 -I scripts/contrast-scan.py --strict
    - python3 -I scripts/check-scheme-contrast.py --self-test
    - python3 -I scripts/check-scheme-contrast.py
    - python3 -I scripts/check-css-budget.py
    - |
      UTIL=$(find -L web/modules -maxdepth 3 -type d -name solo_utilities -print -quit 2>/dev/null || true)
      if [ -z "$UTIL" ] || [ ! -f "$UTIL/src/Css/ThemeLibraryRegistrar.php" ]; then
        echo "SKIPPED check-schemes and check-cascade: solo_utilities (with src/Css/ThemeLibraryRegistrar.php) not found under web/modules; Composer did not install it. These two checks did NOT run."
      else
        echo "solo_utilities found at $UTIL"
        python3 -I scripts/check-schemes.py --utilities "$UTIL"
        LANE=$(mktemp -d "${TMPDIR:-/tmp}/solo-lane.XXXXXX")
        ln -s "$PWD/$UTIL" "$LANE/solo_utilities"
        python3 -I scripts/check-cascade.py --solo "$PWD" --lane "$LANE"
      fi
