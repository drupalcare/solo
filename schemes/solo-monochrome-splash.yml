# Scheme record in the shape of the apex scheme sidecar (id, name, category, mode). Palette values are copied verbatim from css/predefined/solo-monochrome-splash.css.
id: solo-monochrome-splash
name: "Monochrome Splash"
category: miscellaneous
mode: mixed
description: "Light content on white, a near-black menu bar and a near-black footer."
brand:
  primary: "#000000"
  secondary: "#000000"
  accent: "#ce103d"
  ink_light: "#ffffff"
  ink_dark: "#000000"
categories:
  - miscellaneous
css: css/predefined/solo-monochrome-splash.css
dependencies:
  - solo/theme-scheme-shared
  - solo/theme-scheme-multi-span
  - solo/theme-scheme-region-paint-1
  - solo/theme-scheme-region-paint-2
  - solo/theme-scheme-region-paint-3
thumbnail: images/schemes/solo-monochrome-splash.webp
palette:
  --sc-head-tx: "#21020a"
  --sc-link-tx: "#ce103d"
  --sc-link-hover-tx: "#af0d34"
  --sc-menu-bg: "#000000"
  --sc-menu-tx: "#ffffff"
  --sc-menu-hover-tx: "#bbbbbb"
  --sc-menu-hover-bg: "#1a1a1a"
  --sc-tab-hover-tx: "#999999"
  --sc-menu-open-tx: "#bbbbbb"
  --sc-menu-open-bg: "#1a1a1a"
  --sc-button-bg: "#000000"
  --sc-button-tx: "#ffffff"
  --sc-button-hover-tx: "#fef0f3"
  --sc-button-hover-bg: "#bf0e38"
  --sc-main-container-bg: "#e8e8e8"
  --sc-top-container-bg: "#dddddd"
  --sc-fixed-search-block-bg: "#eeeeee"
  --sc-popup-login-block-inner-bg: "#f6f6f6"
  --sc-bottom-container-bg: "#1a1a1a"
  --sc-footer-container-bg: "#111111"
  --sc-footer-menu-bg: "#090909"
  --sc-copyright-bg: "#000000"
  --sc-social-fill: "#b3b3b3"
  --sc-control-br: "#b3b3b3"
  --sc-fixed-search-block-shadow: "9, 9, 9"
  --sc-social-box-shadow: "102, 102, 102"
page:
  --r-border: "#a2a2a2"
  --r-background: "#ffffff"
  --r-text: "#000000"
  --solo-accent-background: "#d5d5d5"
  --solo-accent-text: "#21020a"
  --r-menu-background-hover: "#1a1a1a"
