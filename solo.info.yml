name: Solo
description: 'W3.CSS is a modern CSS framework with built-in responsiveness. It is Smaller, faster, easier to learn and easier to use than other CSS frameworks.<br/><strong>You can create unlimited UI design by using the <a target=_blank href=https://www.drupal.org/project/w3css_paragraphs>W3CSS Paragraphs.</strong></a><br/>Developed & Designed by <strong><a target=_blank href=https://www.alaahaddad.com>Alaa Haddad</a></strong><br/>For theme <a target=_blank href=https://www.drupal.org/node/2866181>documentation</a><br/>To view a <a target=_blank href=http://www.drupal8-w3css-theme.flashwebcenter.com>live demo</a><br/>To view the <a target=_blank href=https://drupal8-w3css-theme.flashwebcenter.com/w3css-predefined-color-themes>color themes</a><br/>For theme issues please <a href=https://www.drupal.org/project/issues/solo>create issue on drupal</a><br/><a target=_blank href=https://www.flashwebcenter.com>Drupal Development</a> and <a target=_blank href=https://www.drupalcare.com>Drupal Maintenance</a>'
package: Solo
type: theme
base theme: false
core_version_requirement: ^10


#Libraries
libraries:
  - solo/solo-global
  - solo/solo-menu

ckeditor_stylesheets:
  - css/theme/solo-ckeditor-iframe.css

ckeditor5-stylesheets:
  - css/theme/solo-ckeditor5.css

