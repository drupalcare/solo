name: 'Solo'
type: theme
description: 'Provides a responsive, accessible theme built on W3.CSS, with 24 regions, color schemes and layout settings. The third generation of the <a href=https://www.drupal.org/project/d8w3css>W3CSS Theme</a>; for richer pages, add the <a href=https://www.drupal.org/project/paragraphs_bundles>Paragraphs Bundles</a> module.<br/><a href=https://www.drupal.org/node/3405889>Documentation</a> - <a href=https://www.drupal.org/project/issues/solo>Issue queue</a> - <a href=https://unitedstarsofamerica.com>Demo site</a> - <a href=https://unitedstarsofamerica.com/color-schemes>Color schemes</a><br/>Designed and developed by <a href=https://www.alaahaddad.com>Alaa Haddad</a> - <a href=https://www.flashwebcenter.com>Drupal development</a> and <a href=https://www.drupalcare.com>Drupal maintenance</a>'
package: 'Solo'
base theme: false
core_version_requirement: ^11.3 || ^12
php: 8.3
dependencies:
  - solo_utilities:solo_utilities

#Libraries
libraries:
  - solo/solo-global
  - solo/solo-menu

ckeditor_stylesheets:
  - css/theme/solo-ckeditor-iframe.css

ckeditor5-stylesheets:
  - css/theme/solo-ckeditor5.css

#Regions
regions:
  highlighted: 'Highlighted'
  popup_login_block: 'Popup Login Block'
  fixed_search_block: 'Fixed Search Block'
  header: 'Header'
  primary_sidebar_menu: 'Primary Sidebar Menu'
  primary_menu: 'Primary Menu'
  welcome_text: 'Welcome Text'
  top_first: 'Top First Container'
  top_second: 'Top Second Container'
  top_third: 'Top Third Container'
  system_messages: 'System Messages'
  page_title: 'Page Title'
  breadcrumb: 'Breadcrumb'
  sidebar_first: 'Left Sidebar'
  content: 'Content'
  sidebar_second: 'Right Sidebar'
  bottom_first: 'Bottom First Container'
  bottom_second: 'Bottom Second Container'
  bottom_third: 'Bottom Third Container'
  bottom_fourth: 'Bottom Fourth Container'
  footer_first: 'Footer First Container'
  footer_second: 'Footer Second Container'
  footer_third: 'Footer Third Container'
  footer_menu: 'Footer Menu Container'
  hidden: 'Hidden Region'
