# Only solo-global and solo-menu are written here. Every other Solo library (fonts, schemes,
# breakpoints, components, w3-css) is built by solo_utilities from shipped data; see libraries/README.md.

solo-global:
  css:
    base:
      css/base/solo-normalize.css: { weight: -200 }
      css/base/solo-variables.css: { weight: -200 }
      css/base/solo-variables-regions.css: { weight: -200 }
      css/base/solo-animation.css: { weight: -200 }
