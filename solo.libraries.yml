      css/components/solo-webform.css: { weight: 0 }
    theme:
      css/theme/solo-regions-animation.css: { weight: 200 }
      css/theme/solo-sitename-animation.css: { weight: 200 }
      css/theme/solo-clickable-image.css: { weight: 200 }
      css/breakpoints/solo-responsive.css: { weight: 200 }
      css/theme/solo-global-settings.css: { weight: 200 }
  js:
    js/components/solo-utils.js: { }
    js/components/solo-scripts.js: { }
    js/components/solo-messages.js: { }
    js/components/solo-comments.js: { }
  dependencies:
    - core/drupal
    - core/once
    - core/drupalSettings
    - core/drupal.ajax
    - core/drupal.message
    - core/drupal.debounce
    - core/drupal.announce

solo-menu:
