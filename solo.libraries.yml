    theme:
      css/theme/solo-menu-side.css: { weight: 300 }
  js:
    js/menu/solo-menu-state-manager.js: {}
    js/menu/solo-menu.js: { }
    js/menu/solo-menu-mobile.js: { }
    js/menu/solo-menu-side.js: { }
    js/menu/solo-menu-repositions-submenus.js: { }
    js/menu/solo-menu-scripts.js: { }
