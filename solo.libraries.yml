      css/components/solo-ckeditor.css: { weight: 0 }
      css/components/solo-comments.css: { weight: 0 }
      css/components/solo-file.css: { weight: 0 }
      css/components/solo-file-upload.css: { weight: 0 }
      css/components/solo-embedded-media.css: { weight: 0 }
      css/components/solo-default-node.css: { weight: 0 }
      css/components/solo-default-views.css: { weight: 0 }
      css/components/solo-forms.css: { weight: 0 }
      css/components/solo-footer-menu.css: { weight: 0 }
      css/components/solo-header.css: { weight: 0 }
      css/components/solo-layout-builder.css: { weight: 0 }
      css/components/solo-maintenance-page.css: { weight: 0 }
      css/components/solo-node-form.css: { weight: 0 }
      css/components/solo-page-title.css: { weight: 0 }
      css/components/solo-pager.css: { weight: 0 }
      css/components/solo-text-content.css: { weight: 0 }
      css/components/solo-skip-link.css: { weight: 0 }
      css/components/solo-system-admin.css: { weight: 0 }
      css/components/solo-system-messages.css: { weight: 0 }
      css/components/solo-system-tabs.css: { weight: 0 }
      css/components/solo-tables.css: { weight: 0 }
      css/components/solo-teaser-mode.css: { weight: 0 }
      css/components/solo-user-login.css: { weight: 0 }
